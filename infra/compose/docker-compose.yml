name: paypulse

# Local dev only. Credentials live in .env (copy from .env.example).
# Host ports: postgres 5432, redis 6379, kafka 9092, rabbitmq 5672/15672,
# redpanda-console 8085, keycloak 8180, grafana 3000, otlp 4317/4318.
# apps profile (localhost only): api-gateway 8080 (debug 5006), customer-service 8082 (debug 5005).

services:
  # --- infra ---
  postgres:
    image: postgres:16.15
    mem_limit: 512m
    profiles: ["infra"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    
  redis:
    image: redis:7
    mem_limit: 128m
    profiles: ["infra"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  # --- apps: our own services, run as containers (images built by `mvn package jib:dockerBuild`) ---
  # Separate profile so you can start only the infra and run ONE service from IntelliJ (Mode B).
  customer-service:
    image: paypulse/customer-service:dev
    # Starting point. If `docker inspect` shows OOMKilled=true, raise it (JVM heap + metaspace + threads).
    mem_limit: 768m
    profiles: ["apps"]
    environment:
      # Inside the compose network the database is called "postgres" (the service name).
      # "localhost" here would be the container itself, where nothing listens on 5432.
      CUSTOMER_DB_URL: jdbc:postgresql://postgres:5432/customer
      # Same credentials as the infra; read from the git-ignored .env, never written here (S8.2).
      CUSTOMER_DB_USER: ${POSTGRES_USER:?set in .env}
      CUSTOMER_DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # JAVA_TOOL_OPTIONS is read by every JVM at start. This one opens the debug port:
      # server=y   -> the JVM listens and the IDE connects to it
      # suspend=n  -> start normally, do not wait for a debugger (suspend=y: wait, for startup bugs)
      # address=*:5005 -> listen on all interfaces INSIDE the container (see ports for who can reach it)
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      # 127.0.0.1: = reachable from this Mac only. Without it Docker publishes on every network
      # interface, and a debug port lets anyone on your Wi-Fi run code in the JVM (S8.4).
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:5005:5005"
    depends_on:
      postgres:
        condition: service_healthy  # wait until Postgres accepts connections, else Flyway fails at boot
    # No healthcheck yet: the image has no curl. Real probes come in L7.

  api-gateway:
    image: paypulse/api-gateway:dev
    mem_limit: 768m
    profiles: ["apps"]
    environment:
      # Default = the customer-service container. The ":-" lets Mode B override it from your shell:
      # CUSTOMER_SERVICE_URL=http://host.docker.internal:8082 (= the service running in IntelliJ).
      CUSTOMER_SERVICE_URL: ${CUSTOMER_SERVICE_URL:-http://customer-service:8082}
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "127.0.0.1:8080:8080"
      # Container port is 5005 too, but host port 5006 so it does not clash with customer-service.
      - "127.0.0.1:5006:5005"

  # --- messaging ---
  kafka:
    image: apache/kafka:4.3.1
    mem_limit: 768m
    profiles: ["messaging"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # HOST = apps on your machine (localhost:9092), DOCKER = containers (kafka:19092)
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    mem_limit: 512m
    profiles: ["messaging"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v3.12.0
    mem_limit: 256m
    profiles: ["messaging"]
    environment:
      KAFKA_BROKERS: kafka:19092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 10


  # --- identity ---
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    mem_limit: 1g
    profiles: ["identity"]
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- observability ---
  otel-lgtm:
    image: grafana/otel-lgtm:0.36.0
    mem_limit: 1536m
    profiles: ["obs"]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres-data:
  kafka-data:
  rabbitmq-data:
